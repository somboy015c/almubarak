<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Almubarak Digital Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand">
      <img class="brand-mark" src="assets/icon.png" alt="Almubarak Digital Hub logo" />
      <span class="brand-text">Almubarak</span>
    </a>
    <button class="nav-item active" data-view="overview"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Overview</button>
    <button class="nav-item" data-view="users"><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Users</button>
    <button class="nav-item" data-view="transactions"><svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="13" y2="18"/></svg>Transactions</button>
    <button class="nav-item" data-view="pricing"><svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41 11 3.83A2 2 0 009.59 3.24L4 3a1 1 0 00-1 1l.24 5.59a2 2 0 00.58 1.41l9.59 9.59a2 2 0 002.83 0l4.35-4.35a2 2 0 000-2.83z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>Pricing</button>
    <div class="sidebar-footer">
      <a class="nav-item" href="dashboard.html"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to app</a>
      <button class="nav-item" id="logout-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log out</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="mobile-appbar">
      <button class="hamburger-btn" id="sidebar-toggle" aria-label="Open menu">
        <svg class="icon" viewBox="0 0 24 24" style="width:22px;height:22px;"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="index.html" class="brand">
        <img class="brand-mark" src="assets/icon.png" alt="Almubarak Digital Hub logo" />
        <span class="brand-text">Admin</span>
      </a>
    </div>
    <div class="topbar">
      <strong>Admin panel</strong>
    </div>

    <div class="view-body">

      <section class="view active" id="view-overview">
        <h2>Overview</h2>
        <div class="stat-grid">
          <div class="card stat-card"><div class="stat-label">Total users</div><div class="stat-value" id="stat-users">—</div></div>
          <div class="card stat-card"><div class="stat-label">Total transactions</div><div class="stat-value" id="stat-tx">—</div></div>
          <div class="card stat-card"><div class="stat-label">Total revenue</div><div class="stat-value" id="stat-revenue">—</div></div>
          <div class="card stat-card"><div class="stat-label">Wallet float outstanding</div><div class="stat-value" id="stat-float">—</div></div>
        </div>
      </section>

      <section class="view" id="view-users">
        <h2>Users</h2>
        <div class="card" style="padding:0; overflow:hidden;">
          <table class="tx-table" id="users-table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Wallet</th><th>Adjust</th></tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="view-transactions">
        <h2>All transactions</h2>
        <div class="card" style="padding:0; overflow:hidden;">
          <table class="tx-table" id="admin-tx-table">
            <thead><tr><th>Description</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="admin-tx-body"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="view-pricing">
        <h2>Pricing & markup</h2>
        <form class="card form-card" id="pricing-form">
          <div class="field">
            <label for="markup-data">Data markup (%)</label>
            <input id="markup-data" type="number" step="0.1" min="0" />
          </div>
          <div class="field">
            <label for="markup-electricity">Electricity markup (%)</label>
            <input id="markup-electricity" type="number" step="0.1" min="0" />
          </div>
          <div class="field">
            <label for="markup-cable">Cable markup (%)</label>
            <input id="markup-cable" type="number" step="0.1" min="0" />
          </div>
          <div class="field">
            <label for="exam-fee">Exam PIN flat fee (₦)</label>
            <input id="exam-fee" type="number" step="1" min="0" />
          </div>
          <button class="btn btn-accent btn-block" type="submit">Save pricing</button>
        </form>
      </section>

    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
