<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Almubarak Digital Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  if (Api.isLoggedIn()) { location.href = 'dashboard.html'; }
</script>
<div class="auth-topbar">
  <a href="index.html" class="brand">
    <img class="brand-mark" src="assets/icon.png" alt="Almubarak Digital Hub logo" />
    Almubarak Digital Hub
  </a>
  <a href="index.html" class="btn btn-ghost btn-sm">
    <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
    Home
  </a>
</div>
<div class="auth-shell">
  <div class="auth-visual" style="--auth-bg-image: url('https://images.pexels.com/photos/1144228/pexels-photo-1144228.jpeg?auto=compress&cs=tinysrgb&w=1200');">
    <div></div>
    <div class="quote">"Welcome back. Your wallet's right where you left it."</div>
    <div></div>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <h2>Log in</h2>
      <p>Access your wallet and keep topping up.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required placeholder="Your password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>
      <div class="switch-link">New here? <a href="register.html"><strong>Create an account</strong></a></div>
    </div>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const data = await Api.post('/auth/login', { email, password });
      Api.setSession(data.token, data.user);
      location.href = 'dashboard.html';
    } catch (err) {
      toast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
